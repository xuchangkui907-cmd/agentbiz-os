[package]
name = "agentbiz-treasury"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.7.0", features = ["legacy"] }
borsh = "1.5"

[dev-dependencies]
near-sdk = { version = "5.7.0", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
